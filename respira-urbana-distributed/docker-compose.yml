services:
  redis:
    image: redis:7-alpine
    container_name: respira-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  geocoding-service:
    build: ./services/geocoding-service
    container_name: respira-geocoding
    command: npm run dev
    volumes:
      - ./services/geocoding-service/src:/app/src
    environment:
      - PORT=3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  weather-service:
    build: ./services/weather-service
    container_name: respira-weather
    command: npm run dev
    volumes:
      - ./services/weather-service/src:/app/src
    environment:
      - PORT=3002
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  air-quality-service:
    build: ./services/air-quality-service
    container_name: respira-air-quality
    command: npm run dev
    volumes:
      - ./services/air-quality-service/src:/app/src
    environment:
      - PORT=3003
      - REDIS_URL=redis://redis:6379
      - AQI_ALERT_THRESHOLD=80
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  risk-service:
    build: ./services/risk-service
    container_name: respira-risk
    command: npm run dev
    volumes:
      - ./services/risk-service/src:/app/src
    environment:
      - PORT=3005
    ports:
      - "3005:3005"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  geodata-service:
    build: ./services/geodata-service
    container_name: respira-geodata
    command: npm run dev
    volumes:
      - ./services/geodata-service/src:/app/src
    environment:
      - PORT=3006
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3006:3006"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  alert-service:
    build: ./services/alert-service
    container_name: respira-alerts
    command: npm run dev
    volumes:
      - ./services/alert-service/src:/app/src
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3004
      - RISK_SERVICE_URL=http://risk-service:3005
      - AIR_QUALITY_SERVICE_URL=http://air-quality-service:3003
      - TRAFFIC_SERVICE_URL=http://traffic-service:3008
      - MONITOR_LOCATIONS=${MONITOR_LOCATIONS:-}
      - MONITOR_INTERVAL_SECONDS=${MONITOR_INTERVAL_SECONDS:-900}
      - AQI_ALERT_THRESHOLD=${AQI_ALERT_THRESHOLD:-80}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3004:3004"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  traffic-service:
    build: ./services/traffic-service
    container_name: respira-traffic
    command: npm run dev
    volumes:
      - ./services/traffic-service/src:/app/src
    environment:
      - PORT=3008
      - REDIS_URL=redis://redis:6379
      - TOMTOM_API_KEY=${TOMTOM_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3008:3008"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3008/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  api-gateway:
    build: ./services/api-gateway
    container_name: respira-gateway
    command: npm run dev
    volumes:
      - ./services/api-gateway/src:/app/src
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - GEOCODING_SERVICE_URL=http://geocoding-service:3001
      - WEATHER_SERVICE_URL=http://weather-service:3002
      - AIR_QUALITY_SERVICE_URL=http://air-quality-service:3003
      - ALERT_SERVICE_URL=http://alert-service:3004
      - RISK_SERVICE_URL=http://risk-service:3005
      - GEODATA_SERVICE_URL=http://geodata-service:3006
      - TRAFFIC_SERVICE_URL=http://traffic-service:3008
      - CACHE_TTL_SECONDS=300
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - TOMTOM_API_KEY=${TOMTOM_API_KEY:-}
      - DEFORESTATION_TILES_URL=${DEFORESTATION_TILES_URL:-}
    depends_on:
      redis:
        condition: service_healthy
      geocoding-service:
        condition: service_started
      weather-service:
        condition: service_started
      air-quality-service:
        condition: service_started
      risk-service:
        condition: service_started
      geodata-service:
        condition: service_started
      traffic-service:
        condition: service_started
      alert-service:
        condition: service_started
    ports:
      - "3000:3000"

  client:
    image: nginx:alpine
    container_name: respira-client
    volumes:
      - ./client:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
