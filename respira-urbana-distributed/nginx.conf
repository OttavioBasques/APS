# Front-end estatico. "no-cache" faz o navegador revalidar os arquivos a cada
# carregamento (usa ETag): editar client/ e atualizar a pagina sempre mostra a
# versao nova, sem precisar limpar o cache.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
